server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. Do not add `add_header` inside a location: nginx would then drop these.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Everything (scripts, styles, fonts) is served by this site; WhatsApp is only a link the visitor follows.
    # The only outside script is Google Analytics (loaded after the visitor accepts the cookie notice). The domains
    # below are Google's list for GA4 with Google signals (the property is linked to Google Ads), which sends hits to
    # doubleclick.net and google.com/google.com.br besides google-analytics.com. A wildcard does not cover the bare
    # domain, so analytics.google.com (where the hits actually go) is listed on its own.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.com https://*.google.com.br; img-src 'self' data: https://*.google-analytics.com https://analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.com https://*.google.com.br; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # The site's other addresses send visitors (and Google) to the official one, so Google does not see the same page
    # twice under different names. Keep it in step with seo.url in content.json.
    if ($host ~* ^(www\.)?mayarabacellar\.com$|^www\.dramayarabacellar\.com$) {
        return 301 https://dramayarabacellar.com$request_uri;
    }

    # Files in /assets have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The doctor's photo keeps its file name when replaced, so only cache it for a day.
    # (Case photos and audios are built into /assets, with a hash in the name.)
    location ~ ^/profile/ {
        expires 1d;
        try_files $uri =404;
    }

    # robots.txt and sitemap.xml are generated at build time; when absent they must be a 404, not the home page.
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Only what the build wrote exists: the start page (/), the service pages (/toxina-botulinica-maringa/ …, one
    # folder with an index.html each, from content.json -> pages.list) and the files. Any other address gets the
    # 404 page with a real 404 status (before, every address answered the start page with 200, a "soft 404" for
    # Google). The app itself never changes the address (only ?query and #hash), so it needs no other path.
    # A page without its final slash is redirected to it; the relative Location keeps https behind Traefik.
    absolute_redirect off;
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    # The pages must always be revalidated so a new deploy is picked up.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
