server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. Do not add `add_header` inside a location: nginx would then drop these.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Everything (scripts, styles, fonts) is served by this site; WhatsApp is only a link the visitor follows.
    # The only outside content: the profile photos of the Google reviewers on the start page.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Files in /assets have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The doctor's photo keeps its file name when replaced, so only cache it for a day.
    # (Case photos and audios are built into /assets, with a hash in the name.)
    location ~ ^/profile/ {
        expires 1d;
        try_files $uri =404;
    }

    # robots.txt and sitemap.xml are generated at build time; when absent they must be a 404, not the home page.
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        expires 1h;
        try_files $uri =404;
    }

    # The page itself must always be revalidated so a new deploy is picked up.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
