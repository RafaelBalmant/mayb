server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. Do not add `add_header` inside a location: nginx would then drop these.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Everything (scripts, styles, fonts) is served by this site; WhatsApp is only a link the visitor follows.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Files in /assets have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The page itself must always be revalidated so a new deploy is picked up.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
