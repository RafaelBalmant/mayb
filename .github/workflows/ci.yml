name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # same steps as the Dockerfile (without the key the reviews script only checks that it still loads)
      - run: npm run reviews
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
